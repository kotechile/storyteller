version: "3.8"

services:
  grounding-dino:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/app/.cache/huggingface
    environment:
      - GROUNDING_DINO_DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hf_cache:
